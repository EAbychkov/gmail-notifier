<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body>
<pre id="out"></pre>
<script>
// toolbar glyph, drawn on a 16-unit grid
const small = ({tile = ['#000', '#000'], flap, env = '#fff', envOpacity = 1, stroke, outline}) => `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${tile[0]}"/><stop offset="1" stop-color="${tile[1]}"/>
    </linearGradient>
  </defs>
  ${outline
    ? `<rect x="1" y="1" width="14" height="14" rx="4" fill="none" stroke="${outline}" stroke-width="1.3"/>`
    : `<rect x="0.5" y="0.5" width="15" height="15" rx="4.3" fill="url(#t)"/>`}
  ${stroke ? `<rect x="0.75" y="0.75" width="14.5" height="14.5" rx="4.1" fill="none" stroke="${stroke}" stroke-width="1.1"/>` : ''}
  <g opacity="${envOpacity}">
    ${outline
      ? `<rect x="3.6" y="4.8" width="8.8" height="6.4" rx="1.3" fill="none" stroke="${outline}" stroke-width="1.2"/>`
      : `<rect x="3.2" y="4.4" width="9.6" height="7.2" rx="1.5" fill="${env}"/>`}
    <path d="M4.1 5.3 L8 8.2 L11.9 5.3" fill="none" stroke="${outline || flap}" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>`;

// store, notification and options artwork, 128-unit grid with Chrome's 16px margin
const large = () => `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7393ff"/><stop offset="1" stop-color="#3a46d6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e2a8a" flood-opacity=".35"/>
    </filter>
    <filter id="e" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141c66" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect x="12" y="10" width="104" height="104" rx="30" fill="url(#t)" filter="url(#s)"/>
  <rect x="12" y="10" width="104" height="104" rx="30" fill="url(#gloss)"/>
  <rect x="40" y="31" width="58" height="40" rx="9" fill="#fff" opacity=".42" transform="rotate(8 69 51)"/>
  <g filter="url(#e)">
    <rect x="28" y="44" width="72" height="50" rx="11" fill="#fff"/>
  </g>
  <path d="M36 53 L64 74 L92 53" fill="none" stroke="#4352e3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

const BLUE = ['#6d8cff', '#3c48d8'];
const states = {
  red: small({tile: BLUE, flap: '#3c48d8'}),
  gray: small({tile: ['#a3a9b3', '#7c838f'], flap: '#7c838f'}),
  blue: small({outline: '#8b919b'}),
  new: small({tile: ['#ffffff', '#eef1ff'], env: '#4a5ae6', flap: '#ffffff', stroke: '#4a5ae6'}),
  load0: small({tile: ['#a3a9b3', '#7c838f'], flap: '#7c838f', envOpacity: .45}),
  load1: small({tile: ['#a3a9b3', '#7c838f'], flap: '#7c838f', envOpacity: .65}),
  load2: small({tile: ['#a3a9b3', '#7c838f'], flap: '#7c838f', envOpacity: .85}),
  load3: small({tile: ['#a3a9b3', '#7c838f'], flap: '#7c838f', envOpacity: 1})
};
const jobs = [];
for (const [dir, svg] of Object.entries(states)) {
  for (const size of [16, 18, 19, 32]) {
    jobs.push({path: `${dir}/${size}.png`, svg, size});
  }
}
for (const size of [48, 64, 128]) {
  jobs.push({path: `red/${size}.png`, svg: large(), size});
}
for (const size of [16, 32, 48, 64]) {
  jobs.push({path: `notification/${size}.png`, svg: size < 48 ? states.red : large(), size});
}
for (const size of [32, 64]) {
  jobs.push({path: `options/${size}.png`, svg: size < 48 ? states.red : large(), size});
}


const render = ({svg, size}) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    c.getContext('2d').drawImage(img, 0, 0, size, size);
    resolve(c.toDataURL('image/png'));
  };
  img.onerror = reject;
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
});
Promise.all(jobs.map(async j => ({path: j.path, data: await render(j)})))
  .then(r => document.getElementById("out").textContent = JSON.stringify({files: r}))
  .catch(e => document.getElementById('out').textContent = 'ERR ' + e);
</script>
</body></html>
